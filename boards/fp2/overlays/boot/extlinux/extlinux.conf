timeout 1
default Buildroot
menu title boot prev kernel

label postmarketOS
	kernel /zImage
	fdt /qcom-msm8974pro-fairphone-fp2.dtb
	initrd /initramfs.gz
	append earlycon=msm_serial_dm,0xf991e000 msm.vram=192m msm.allow_vram_carveout=1 fbcon=rotate:1 fbcon=font:TER16x32 rootfs=/dev/mmcblk0p20p2 bootpart=/dev/mmcblk0p20p1 resize_rootfs=1

# Lime carrier board without a battery pack (the Citronics rig): its device
# tree has the display off and the 4.3 V minimum input voltage the carrier's
# supply needs. Not the default; select it when booting on that board.
label lime-rig
	kernel /zImage
	fdt /qcom-msm8974pro-fairphone-fp2-rig.dtb
	initrd /initramfs.gz
	append earlycon=msm_serial_dm,0xf991e000 rootfs=/dev/mmcblk0p20p2 bootpart=/dev/mmcblk0p20p1 resize_rootfs=1 cpufreq.default_governor=schedutil
