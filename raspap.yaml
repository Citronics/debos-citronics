{{- $carrier := .carrier -}}
{{- $board := .board -}}
{{- $architecture := .architecture -}}
{{- $image := or .image (printf "raspap-%s-%s.img" $carrier $board) -}}

# The Debian image (debian.yaml) with the RaspAP WiFi access point and the
# MobileDataManager plugin on top.

architecture: {{ $architecture }}

actions:
  - action: debootstrap
    suite: "trixie"
    components:
      - main
      - non-free-firmware
    mirror: https://deb.debian.org/debian
    variant: minbase

  - action: apt
    description: Install base system packages
    packages: [udev, ca-certificates, coreutils, sudo, openssh-server, adduser, systemd, systemd-sysv, systemd-resolved, nano, vim, qrtr-tools, libqmi-utils, rmtfs, udev, kmod, network-manager, modemmanager, wpasupplicant, ifupdown, isc-dhcp-client, isc-dhcp-server, systemd-timesyncd, bluetooth, kpartx, cloud-utils, fake-hwclock, wireless-regdb, usbutils, iputils-ping]

  - action: apt
    description: Install RaspAP dependencies (as its installer does on Debian 13)
    packages: [lighttpd, git, hostapd, dnsmasq, iptables-persistent, vnstat, qrencode, php8.4-fpm, jq, isoquery, iso-codes, dhcpcd-base, iw, rsync, curl, wget, procps, libjs-jquery, libjs-jquery-datatables]

  - action: run
    description: APT sources with security updates, image upgraded
    chroot: true
    script: scripts/setup-apt-sources.sh

  - action: run
    description: Add citronics APT repository
    chroot: true
    script: scripts/add-citronics-repo.sh

  - action: apt
    description: Install Citronics kernel and firmware
    packages: [initramfs-tools, citronics-{{ $carrier }}-{{ $board }}]

  - action: run
    chroot: true
    script: scripts/setup-user.sh

  - action: run
    chroot: true
    command: echo citronics > /etc/hostname

  - action: run
    description: Set up /etc/hosts
    chroot: true
    command: |
      echo "127.0.0.1	localhost" > /etc/hosts
      echo "127.0.1.1	citronics" >> /etc/hosts

  - action: overlay
    description: Apply base system overlays
    source: overlays
    destination: /

  - action: overlay
    description: Apply carrier-specific overlays
    source: carriers/{{ $carrier }}/overlays
    destination: /

  - action: overlay
    description: Apply board-specific overlays
    source: boards/{{ $board }}/overlays
    destination: /

  - action: run
    description: Carrier-specific setup
    chroot: true
    script: carriers/{{ $carrier }}/scripts/setup-carrier.sh

  - action: overlay
    description: Apply RaspAP-specific overlays (override conflicting base configs)
    source: raspap-overlays/system
    destination: /

  - action: run
    description: Enable networking services (RaspAP variant)
    chroot: true
    script: scripts/setup-networking-raspap.sh

  - action: run
    description: RaspAP release to install
    chroot: false
    command: cp ${RECIPEDIR}/raspap.version ${ROOTDIR}/tmp/raspap.version

  - action: run
    description: Install RaspAP web interface
    chroot: true
    script: scripts/setup-raspap.sh

  - action: overlay
    description: Copy MobileDataManager plugin files to staging area
    source: raspap-overlays/MobileDataManager
    destination: /var/cache/MobileDataManager

  - action: run
    description: Install MobileDataManager plugin
    chroot: true
    script: scripts/setup-mobile-data-manager.sh

  - action: run
    chroot: true
    command: update-initramfs -c -k all

  - action: run
    description: Set up boot partition (kernel, DTB, initramfs)
    chroot: true
    script: scripts/setup-boot.sh

  - action: run
    description: Verify boot partition contract (extlinux.conf)
    chroot: true
    script: scripts/verify-boot.sh

  - action: run
    description: License manifest of the image
    chroot: true
    script: scripts/license-manifest.sh

  - action: run
    description: License manifest next to the image
    chroot: false
    command: cp ${ROOTDIR}/usr/share/doc/citronics-image/licenses.txt ${ARTIFACTDIR}/{{ $image }}.licenses.txt

  - action: image-partition
    imagename: {{ $image }}
    imagesize: 1792MB
    partitiontype: msdos
    mountpoints:
      - mountpoint: /
        partition: root
      - mountpoint: /boot
        partition: boot
    partitions:
      - name: boot
        fs: ext2
        # The initramfs mounts /boot from a device-mapper partition that udev
        # never marks ready: a boot-time fsck would wait 90 s for it, then fail.
        fsck: false
        start: 0%
        end: 128MB
        flags: [ boot ]
      - name: root
        fs: ext4
        start: 128MB
        end: 100%

  - action: filesystem-deploy
    description: Deploying filesystem onto image
