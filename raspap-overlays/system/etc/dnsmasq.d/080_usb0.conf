# DHCP on the USB link (usb0, 10.0.42.1), as the Debian and Ubuntu images
# serve it: the computer gets 10.0.42.2, without a route or DNS server, so it
# keeps its own internet access. Phones whose USB port is a host (the Lime
# carrier) have no usb0.
interface=usb0
dhcp-range=set:usb0,10.0.42.2,10.0.42.2,255.255.255.0,2m
dhcp-option=tag:usb0,option:router
dhcp-option=tag:usb0,option:dns-server
