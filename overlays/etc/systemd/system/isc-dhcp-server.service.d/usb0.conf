# The DHCP server only serves the USB network link. usb0 does not exist
# while the USB port is a host (the Lime carrier in Default mode): the
# server is then skipped, and udev starts it when usb0 appears, once
# ifupdown has given usb0 its address.
[Unit]
ConditionPathExists=/sys/class/net/usb0
After=ifup@usb0.service
